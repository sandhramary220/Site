<!-- LIGHTBOX -->
<!-- LIGHTBOX -->

<!-- LIGHTBOX -->
<div id="lightbox" class="lightbox">
  <span class="close">&times;</span>
  <span class="prev">&#10094;</span>
  <div class="lightbox-content">
    <img id="lightbox-img" src="" alt="">
  </div>
  <span class="next">&#10095;</span>
</div>

<footer class="hand">
  <p>© 2025 Sandhra Mary — All Rights Reserved</p>
</footer>


<script>
// Expand / Collapse Series Galleries
function toggleGallery(num) {
  const g1 = document.getElementById('gallery1');
  const g2 = document.getElementById('gallery2');

  if (num === 1) {
    g1.classList.toggle('hidden');
g2.classList.add('hidden');
attachLightboxEvents();

    g1.scrollIntoView({ behavior: "smooth" });
  } else {
    g2.classList.toggle('hidden');
g1.classList.add('hidden');
attachLightboxEvents();

    g2.scrollIntoView({ behavior: "smooth" });
  }
}


// Grab all images in galleries
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightbox-img');
const closeBtn = document.querySelector('.close');
const nextBtn = document.querySelector('.next');
const prevBtn = document.querySelector('.prev');

// Close lightbox
closeBtn.addEventListener('click', () => lightbox.classList.remove('active'));

// Close lightbox if clicked outside image
lightbox.addEventListener('click', (e) => {
  if (e.target === lightbox) lightbox.classList.remove('active');
});

// Optional: Close with Escape / navigate with arrows
document.addEventListener('keydown', (e) => {
  if (!lightbox.classList.contains('active')) return;
  if (e.key === 'Escape') lightbox.classList.remove('active');
  if (e.key === 'ArrowRight') nextBtn.click();
  if (e.key === 'ArrowLeft') prevBtn.click();
});

// Lightbox logic
let currentGalleryImages = [];
let currentIndex = 0;

// Attach click events WHEN a gallery is opened
function attachLightboxEvents() {
  document.querySelectorAll(".char-gallery img").forEach((img) => {
    img.onclick = (e) => {
      const gallery = e.target.closest(".char-gallery");
      currentGalleryImages = Array.from(gallery.querySelectorAll("img"));
      currentIndex = currentGalleryImages.indexOf(e.target);

      lightboxImg.src = e.target.src;
      lightbox.classList.add("active");
    };
  });
}


// Next button
nextBtn.addEventListener("click", () => {
  currentIndex = (currentIndex + 1) % currentGalleryImages.length;
  lightboxImg.src = currentGalleryImages[currentIndex].src;
});

// Prev button
prevBtn.addEventListener("click", () => {
  currentIndex = (currentIndex - 1 + currentGalleryImages.length) % currentGalleryImages.length;
  lightboxImg.src = currentGalleryImages[currentIndex].src;
});

function loadImages(folder, containerId) {
  const container = document.getElementById(containerId);
  let i = 1;

  function tryLoad() {
    const img = new Image();
    img.src = `${folder}/${i}.jpg`;

    img.onload = () => {
      container.appendChild(img);
      i++;
      tryLoad(); // load next image automatically
    };

    img.onerror = () => {
      return; // stop when there are no more files
    };
  }

  tryLoad();
}

// Load when page opens
loadImages("character/IMG2", "gallery2-images");

</script>


</body>
