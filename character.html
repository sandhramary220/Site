<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Aboreto&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="top-nav">
  <nav>
    <a href="index.html">Home</a>
    <a href="films.html">Films</a>
    <a href="comics.html">Comics</a>
    <a href="photography.html">Photography</a>
    <a class="active" href="character.html">Character</a>
    <a href="storyboard.html">Storyboard</a>
  </nav>
</header>


<section class="works-section">
  <h2 class="hand">CHARACTER DESIGN</h2>

  <div class="character-main">
    <div class="char-box" onclick="toggleGallery(1)">
      <img src="character/01.jpg" class="char-preview">
      <h3 class="hand">Series 1</h3>
    </div>

    <div class="char-box" onclick="toggleGallery(2)">
      <img src="character/02.jpg" class="char-preview">
      <h3 class="hand">Series 2</h3>
    </div>
  </div>

  <!-- Gallery 1 -->
  <div id="gallery1" class="hidden gallery-container">
    <div class="char-gallery">
      <img src="character/IMG1/1.jpg" alt="">
      <img src="character/IMG1/2.jpg" alt="">
      <img src="character/IMG1/3.jpg" alt="">
	  <img src="character/IMG1/4.jpg" alt="">
      <img src="character/IMG1/5.jpg" alt="">
      <img src="character/IMG1/6.jpg" alt="">
    </div>
  </div>

  <!-- Gallery 2 -->
  <div id="gallery2" class="hidden gallery-container">
    <div class="char-gallery">
      <img src="character/IMG2/1.jpg" alt="">
    </div>
  </div>

</section>


<!-- LIGHTBOX -->
<!-- LIGHTBOX -->

<!-- LIGHTBOX -->
<div id="lightbox" class="lightbox">
  <span class="close">&times;</span>
  <span class="prev">&#10094;</span>
  <div class="lightbox-content">
    <img id="lightbox-img" src="" alt="">
  </div>
  <span class="next">&#10095;</span>
</div>

<footer class="hand">
  <p>© 2025 Sandhra Mary — All Rights Reserved</p>
</footer>


<script>
// Expand / Collapse Series Galleries
function toggleGallery(num) {
  const g1 = document.getElementById('gallery1');
  const g2 = document.getElementById('gallery2');

  if (num === 1) {
    g1.classList.toggle('hidden');
    g2.classList.add('hidden');
    g1.scrollIntoView({ behavior: "smooth" });
  } else {
    g2.classList.toggle('hidden');
    g1.classList.add('hidden');
    g2.scrollIntoView({ behavior: "smooth" });
  }
}


// Grab all images in galleries
const images = document.querySelectorAll('.char-gallery img');
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightbox-img');
const closeBtn = document.querySelector('.close');
const nextBtn = document.querySelector('.next');
const prevBtn = document.querySelector('.prev');

let index = 0;

// Open lightbox on image click
images.forEach((img, i) => {
  img.addEventListener('click', () => {
    index = i;
    lightbox.classList.add('active');
    lightboxImg.src = img.src;
  });
});

// Close lightbox
closeBtn.addEventListener('click', () => lightbox.classList.remove('active'));

// Next / Previous buttons
nextBtn.addEventListener('click', () => {
  index = (index + 1) % images.length;
  lightboxImg.src = images[index].src;
});

prevBtn.addEventListener('click', () => {
  index = (index - 1 + images.length) % images.length;
  lightboxImg.src = images[index].src;
});

// Close lightbox if clicked outside image
lightbox.addEventListener('click', (e) => {
  if (e.target === lightbox) lightbox.classList.remove('active');
});

// Optional: Close with Escape / navigate with arrows
document.addEventListener('keydown', (e) => {
  if (!lightbox.classList.contains('active')) return;
  if (e.key === 'Escape') lightbox.classList.remove('active');
  if (e.key === 'ArrowRight') nextBtn.click();
  if (e.key === 'ArrowLeft') prevBtn.click();
});
</script>

</body>
</html>
